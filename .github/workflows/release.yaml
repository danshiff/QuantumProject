name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix (must match pyproject.toml)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.5

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)

          project_version = project["project"]["version"]
          requested_version = os.environ["VERSION"]

          if project_version != requested_version:
              raise SystemExit(
                  f"Requested version {requested_version} does not match "
                  f"pyproject.toml version {project_version}"
              )
          PY

          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Failed to check whether tag ${TAG} exists."
              exit "$status"
            fi
          fi

      - name: Build distributions
        run: uv build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          TARGET="$(git rev-parse HEAD)"

          gh release create "$TAG" dist/* \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes
