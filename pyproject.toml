[project]
name = "quantumexperiments"
version = "0.1"
description = "Experiments in quantum computing with Qiskit"
requires-python = ">=3.14"
dependencies = [
    "qiskit",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
