[project]
name = "quantumexperiments"
version = "0.1"
description = "Experiments in quantum computing with Qiskit"
requires-python = ">=3.14"
dependencies = [
    "qiskit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.10",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
